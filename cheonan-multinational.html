<section class="premium">

  <style>
    .premium {
      overflow: hidden;
      border: 1px solid #a77d1f;
      border-radius: 24px;
      background:
        radial-gradient(circle at top, rgba(218,174,72,.18), transparent 34%),
        linear-gradient(180deg, #120d05 0%, #070707 55%, #050505 100%);
      box-shadow: 0 20px 70px rgba(0,0,0,.55);
    }

    .premium-visual {
      padding: 34px 20px 24px;
      text-align: center;
    }

    .premium-visual .small {
      color: #d8ad44;
      font-weight: 800;
      letter-spacing: 5px;
      font-size: 14px;
    }

    .premium-visual h2 {
      margin: 8px 0 4px;
      font-size: 56px;
      line-height: 1.1;
      color: #e6bc4e;
      font-weight: 900;
      letter-spacing: -3px;
      text-shadow: 0 0 25px rgba(215,170,53,.15);
    }

    .premium-visual .sub {
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 2px;
    }

    .girl-area {
      margin-top: 25px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .girl-card {
      min-height: 270px;
      border: 1px solid #74581f;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      background:
        linear-gradient(180deg, rgba(0,0,0,.06), rgba(0,0,0,.58)),
        radial-gradient(circle at center, #38250f 0%, #0b0b0b 70%);
    }

    .girl-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .girl-label {
      position: absolute;
      left: 12px;
      bottom: 12px;
      padding: 7px 12px;
      border-radius: 30px;
      background: rgba(0,0,0,.72);
      border: 1px solid rgba(220,177,70,.45);
      color: #f0d17a;
      font-size: 14px;
      font-weight: 800;
    }

    .flags-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 22px 0 6px;
    }

    .flag-pill {
      padding: 8px 14px;
      border-radius: 40px;
      border: 1px solid #6d5521;
      background: #120f09;
      color: #eee;
      font-size: 14px;
    }

    .price-box {
      margin: 24px 20px 16px;
      padding: 24px 18px;
      border: 1px solid #c99829;
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 0%, rgba(215,172,62,.18), transparent 45%),
        #0d0d0d;
      text-align: center;
    }

    .price-box .label {
      color: #e7c15b;
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .price-box .price {
      font-size: 68px;
      line-height: 1.1;
      font-weight: 900;
      color: #ebc357;
      letter-spacing: -4px;
    }

    .price-box .price span {
      color: #fff;
      font-size: 28px;
      letter-spacing: -1px;
      margin-right: 6px;
    }

    .benefit-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 0 20px 20px;
    }

    .benefit-card {
      min-height: 120px;
      border-radius: 14px;
      border: 1px solid #4d3a18;
      background: #111;
      text-align: center;
      padding: 18px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .benefit-card .emoji {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .benefit-card strong {
      color: #efcf74;
      font-size: 16px;
    }

    .benefit-card small {
      color: #aaa;
      margin-top: 2px;
      font-size: 13px;
    }

    .main-cta {
      display: block;
      margin: 8px 20px 24px;
      padding: 19px 20px;
      border-radius: 50px;
      text-align: center;
      text-decoration: none;
      font-weight: 900;
      font-size: 20px;
      color: #080808;
      background: linear-gradient(135deg, #f0ce68, #b68420);
      box-shadow: 0 10px 35px rgba(205,160,51,.18);
    }

    .service-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 0 20px 24px;
    }

    .service-card {
      border: 1px solid #3e3218;
      border-radius: 14px;
      padding: 16px 8px;
      text-align: center;
      background: #0e0e0e;
      font-size: 13px;
      color: #ddd;
    }

    .service-card b {
      display: block;
      color: #ebc65c;
      font-size: 15px;
      margin-bottom: 2px;
    }

    @media (max-width: 700px) {
      .premium-visual h2 {
        font-size: 42px;
      }

      .girl-area {
        grid-template-columns: 1fr 1fr;
      }

      .girl-card {
        min-height: 210px;
      }

      .price-box .price {
        font-size: 52px;
      }

      .price-box .price span {
        font-size: 23px;
      }

      .benefit-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .service-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .main-cta {
        font-size: 17px;
      }
    }
  </style>

      </div>

      <div class="girl-card">

      </div>

  </div>

    </div>

  <div class="benefit-grid">

      <div class="emoji">🍻</div>
      <strong>소주 · 맥주</strong>

    </div>

    <div class="benefit-card">
      <div class="emoji">🍽️</div>
      <strong>안주</strong>

    </div>

    <div class="benefit-card">

    <div class="benefit-card">
